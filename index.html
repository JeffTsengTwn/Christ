<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0908" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>基督傳之人子</title>
  <meta name="description" content="四福音書裡的一生。像素風格的網頁小遊戲。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:title" content="基督傳之人子" />
  <meta property="og:description" content="四福音書裡的一生。像素風格的網頁小遊戲。" />
  <meta property="og:url" content="https://jefftsengtwn.github.io/Christ/" />
  <meta property="og:image" content="https://jefftsengtwn.github.io/Christ/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="基督傳之人子" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="基督傳之人子" />
  <meta name="twitter:description" content="四福音書裡的一生。像素風格的網頁小遊戲。" />
  <meta name="twitter:image" content="https://jefftsengtwn.github.io/Christ/og.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%231a140f' width='16' height='16'/%3E%3Cpath fill='%23f0c84b' d='M7 2h2v4h4v2H9v6H7V8H3V6h4z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #241910;
      --paper: #f4ead4;
      --paper-2: #e7d7b4;
      --red: #8c2f2f;
      --gold: #a67c2d;
      --sea: #16384f;
      --bar-top: 0px;
      --bar-right: 0px;
      --bar-bottom: 0px;
      --bar-left: 0px;
      --safe-top: max(var(--bar-top), env(safe-area-inset-top, 0px));
      --safe-right: max(var(--bar-right), env(safe-area-inset-right, 0px));
      --safe-bottom: max(var(--bar-bottom), env(safe-area-inset-bottom, 0px));
      --safe-left: max(var(--bar-left), env(safe-area-inset-left, 0px));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #0b0908;
    }

    html.can-nudge,
    html.can-nudge body {
      min-height: calc(100lvh + 120px);
    }

    html.chrome-lock,
    html.chrome-lock body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      color: var(--paper);
      font-family: "PingFang TC", "Heiti TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #frame {
      position: fixed;
      left: 0;
      top: 0;
      background: #1a140f;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 320px;
      height: 192px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #87b6d8;
    }

    #splash-art {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      pointer-events: none;
      background: transparent;
      image-rendering: auto;
    }

    #tag, #floats, #hud, #dialogue, #screen {
      position: absolute;
      pointer-events: none;
    }

    #tag {
      left: 0;
      top: 0;
      z-index: 3;
      padding: 0.15em 0.45em;
      background: rgba(28, 20, 14, 0.88);
      color: var(--paper);
      border: 2px solid #f0c84b;
      white-space: nowrap;
      font-size: 0.72em;
      letter-spacing: 0.04em;
    }

    #floats { inset: 0; z-index: 3; overflow: hidden; }

    .float {
      position: absolute;
      left: 0;
      top: 0;
      color: #fff8e8;
      text-shadow: 0 1px 0 #000, 0 0 4px #000;
      white-space: nowrap;
      font-size: 0.78em;
    }

    #hud {
      inset: 0;
      z-index: 4;
    }

    #topbar {
      position: absolute;
      top: calc(0.35em + var(--safe-top));
      left: calc(0.4em + var(--safe-left));
      right: calc(0.4em + var(--safe-right));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.4em;
    }

    #ch-name {
      display: inline-block;
      font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
      font-size: 0.95em;
      letter-spacing: 0.12em;
      background: rgba(20, 14, 10, 0.82);
      padding: 0.12em 0.42em;
      text-shadow: 0 1px 0 #000;
    }

    #role, #held, #progress, #wind {
      display: inline-block;
      margin-top: 0.25em;
      padding: 0.12em 0.4em;
      background: rgba(28, 20, 14, 0.78);
      border: 2px solid rgba(244, 234, 212, 0.7);
      font-size: 0.72em;
    }

    #top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.28em;
    }

    #hud-btns { display: flex; gap: 0.3em; pointer-events: auto; }

    #hud-btns button, .btn {
      font: inherit;
      cursor: pointer;
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 0.18em 0.45em;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
    }

    #hud-btns button { font-size: 0.72em; pointer-events: auto; }

    body.lang-en {
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Songti TC", serif;
    }

    body.lang-en .card h1,
    body.lang-en .card h2,
    body.lang-en #ch-name,
    body.lang-en #d-name {
      letter-spacing: 0.04em;
    }

    body.lang-en #ch-name {
      max-width: 15em;
      line-height: 1.25;
    }

    #hud-btns button.pulse {
      animation: pulse 0.8s ease 2;
      border-color: #f0c84b;
    }

    @keyframes pulse {
      50% { transform: translateY(-1px); background: #fff4cf; }
    }

    #faith {
      display: flex;
      align-items: center;
      gap: 0.3em;
      font-size: 0.7em;
      text-shadow: 0 1px 0 #000;
    }

    #faith-track {
      width: 6.2em;
      height: 0.7em;
      border: 2px solid #f6edd8;
      background: rgba(0, 0, 0, 0.45);
    }

    #faith-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #8c2f2f, #f0c84b);
    }

    #objective, #hint {
      position: absolute;
      left: 0.45em;
      right: 0.45em;
      text-shadow: 0 1px 0 #000, 0 0 5px rgba(0, 0, 0, 0.85);
      font-size: 0.75em;
      line-height: 1.35;
    }

    #objective {
      bottom: 0.4em;
      width: fit-content;
      max-width: 78%;
      background: rgba(20, 14, 10, 0.82);
      padding: 0.22em 0.45em;
    }
    #hint { bottom: 1.7em; opacity: 0.85; font-size: 0.68em; }

    #dialogue {
      left: 2.5%;
      right: 2.5%;
      bottom: 0.45em;
      z-index: 5;
      background: var(--paper);
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
      padding: 0.45em 0.6em 0.5em;
      max-height: 48%;
      overflow: auto;
      pointer-events: auto;
      user-select: text;
    }

    #d-name {
      font-size: 0.78em;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin-bottom: 0.2em;
    }

    #d-name.who-you { color: #2d5878; }
    #d-name.who-jesus { color: #8c2f2f; }
    #d-name.who-narr { color: transparent; height: 0; margin: 0; }

    #d-text {
      font-size: 0.92em;
      line-height: 1.45;
      min-height: 1.45em;
    }

    #d-text.verse {
      font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
    }

    #d-ref {
      margin-top: 0.25em;
      color: var(--gold);
      font-size: 0.72em;
    }

    #d-next {
      text-align: right;
      font-size: 0.68em;
      letter-spacing: 0.08em;
      opacity: 0.7;
    }

    #screen {
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      padding:
        calc(0.6em + var(--safe-top))
        calc(0.6em + var(--safe-right))
        calc(0.6em + var(--safe-bottom))
        calc(0.6em + var(--safe-left));
      pointer-events: auto;
    }

    #screen .splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.35em 0.55em 0.28em;
      background: none;
      color: #f4ead4;
      text-shadow: 1px 1px 0 #120e0c, 2px 2px 0 #120e0c;
      cursor: pointer;
    }

    #screen .splash h1 {
      margin: 0;
      color: #fff8ee;
      font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
      font-size: 2.05em;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 1.15;
      text-align: left;
      text-shadow: 0 2px 0 #120e0c, 0 0 10px rgba(12, 8, 6, 0.95);
    }

    body.lang-en #screen .splash h1 {
      letter-spacing: 0.02em;
      font-size: 1.7em;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", serif;
    }

    #screen .splash .sub {
      margin-top: 0.28em;
      color: #fff8ee;
      letter-spacing: 0.16em;
      font-size: 0.92em;
      text-shadow: 0 1px 0 #120e0c, 0 0 8px rgba(12, 8, 6, 0.95);
    }

    .splash-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6em;
      margin: -0.35em -0.55em 0;
      padding:
        calc(0.45em + var(--safe-top))
        calc(0.55em + var(--safe-right))
        1.35em
        calc(0.55em + var(--safe-left));
      background: linear-gradient(rgba(12, 8, 6, 0.88), rgba(12, 8, 6, 0.62) 62%, rgba(12, 8, 6, 0));
    }

    .splash-foot {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35em;
      margin: 0 -0.55em -0.28em;
      padding:
        1.4em
        calc(0.55em + var(--safe-right))
        calc(0.4em + var(--safe-bottom))
        calc(0.55em + var(--safe-left));
      background: linear-gradient(rgba(12, 8, 6, 0), rgba(12, 8, 6, 0.9) 42%, rgba(12, 8, 6, 0.94));
    }

    .splash-bars {
      display: none;
      margin: 0;
      font-size: 0.72em;
      letter-spacing: 0.08em;
      color: #fff8ee;
    }

    html.bars-open .splash-bars { display: block; }

    .splash-credit {
      font-size: 0.55em;
      letter-spacing: 0.03em;
      line-height: 1.35;
      color: #f6edd8;
      text-shadow: 0 1px 2px #120e0c;
    }

    .splash-lang {
      pointer-events: auto;
      border: 2px solid #f0c84b;
      background: rgba(18, 14, 12, 0.72);
      color: #f0c84b;
      font: inherit;
      font-size: 0.72em;
      letter-spacing: 0.08em;
      padding: 0.2em 0.45em;
      cursor: pointer;
    }

    .splash-go {
      align-self: flex-start;
      border: 2px solid #fff8ee;
      background: #120e0c;
      color: #fff8ee;
      font: inherit;
      font-size: 1.45em;
      letter-spacing: 0.16em;
      line-height: 1.2;
      padding: 0.18em 0.45em;
      cursor: pointer;
      text-shadow: none;
      animation: splashblink 1.2s step-end infinite;
    }

    body.lang-en .splash-go {
      font-size: 1.2em;
      letter-spacing: 0.04em;
    }

    @keyframes splashblink {
      0%, 49% {
        background: #120e0c;
        color: #fff8ee;
        border-color: #fff8ee;
      }
      50%, 100% {
        background: #fff8ee;
        color: #120e0c;
        border-color: #120e0c;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-go { animation: none; }
    }

    #screen .card {
      width: min(100%, 28em);
      max-height: 100%;
      overflow: auto;
      background: linear-gradient(180deg, var(--paper), var(--paper-2));
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
      padding: 0.85em 0.9em 0.75em;
      user-select: text;
    }

    .card h1 {
      font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-align: center;
      font-size: 1.7em;
      margin: 0.1em 0 0.15em;
    }

    .card h2 {
      font-family: "Songti TC", "PMingLiU", serif;
      font-size: 1.05em;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.12em;
      margin: 0 0 0.2em;
    }

    .sub, .ref {
      text-align: center;
      color: #6d542c;
      font-size: 0.78em;
      letter-spacing: 0.08em;
      margin: 0 0 0.35em;
    }

    .card p { margin: 0.35em 0; line-height: 1.55; font-size: 0.86em; }

    .verse {
      font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
      line-height: 1.6;
    }

    .rule {
      height: 2px;
      background: var(--ink);
      margin: 0.55em 0;
      box-shadow: 0 3px 0 #e0c48a;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
      justify-content: center;
      margin-top: 0.7em;
    }

    .btn.primary {
      background: var(--red);
      color: #f6edd8;
    }

    .btn.primary:hover { background: #a33b38; }
    .btn.ghost { background: transparent; box-shadow: none; }

    .chapters { display: grid; gap: 0.35em; margin-top: 0.4em; }
    .chapters button { width: 100%; text-align: left; }

    .note {
      margin-top: 0.7em;
      font-size: 0.68em;
      line-height: 1.45;
      color: #5c4a32;
      text-align: center;
    }

    .journal-item { margin: 0.45em 0 0.6em; }
    .journal-item .ref { text-align: left; margin-bottom: 0.15em; }

    #touch {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    @media (pointer: coarse) {
      #touch { display: block; }

      body.controls-over #dialogue {
        bottom: calc(184px + var(--safe-bottom));
      }

      body.controls-over #objective {
        bottom: calc(192px + var(--safe-bottom));
      }

      body.controls-over #hint {
        bottom: calc(224px + var(--safe-bottom));
      }
    }

    .pad {
      position: absolute;
      left: max(24px, var(--safe-left));
      bottom: max(12px, var(--safe-bottom));
      display: grid;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px 52px;
      gap: 4px;
      pointer-events: auto;
    }

    .pad button, #btn-talk {
      pointer-events: auto;
      touch-action: none;
      font: inherit;
      border: 2px solid rgba(36, 25, 16, 0.4);
      background: rgba(244, 234, 212, 0.46);
      color: #241910;
      text-shadow: 0 1px 0 rgba(255, 248, 238, 0.7);
      box-shadow: none;
    }

    .pad button:active, #btn-talk:active {
      background: rgba(244, 234, 212, 0.82);
    }

    .pad button { font-size: 18px; }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }

    #btn-talk {
      position: absolute;
      right: max(16px, var(--safe-right));
      bottom: max(22px, var(--safe-bottom));
      width: 74px;
      height: 74px;
      border-radius: 50%;
      font-size: 16px;
      letter-spacing: 0.12em;
    }

    body.lang-en #btn-talk {
      font-size: 13px;
      letter-spacing: 0;
    }

    @media (pointer: coarse) and (max-height: 520px) {
      .pad {
        grid-template-columns: 42px 42px 42px;
        grid-template-rows: 42px 42px 42px;
        gap: 3px;
      }

      #btn-talk {
        width: 60px;
        height: 60px;
        font-size: 14px;
      }

      body.controls-over #dialogue {
        left: calc(168px + var(--safe-left));
        right: calc(92px + var(--safe-right));
        bottom: calc(8px + var(--safe-bottom));
        max-height: 46%;
      }

      body.controls-over #objective {
        left: calc(168px + var(--safe-left));
        right: calc(92px + var(--safe-right));
        bottom: calc(8px + var(--safe-bottom));
        max-width: none;
      }

      body.controls-over #hint {
        left: calc(168px + var(--safe-left));
        right: calc(92px + var(--safe-right));
        bottom: calc(52px + var(--safe-bottom));
      }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="game" width="320" height="192"></canvas>
    <canvas id="splash-art" class="hidden" width="640" height="384"></canvas>
    <div id="tag" class="hidden"></div>
    <div id="floats"></div>
    <div id="hud" class="hidden">
      <div id="topbar">
        <div>
          <div id="ch-name"></div>
          <div id="role" class="hidden"></div>
          <div id="held" class="hidden"></div>
        </div>
        <div id="top-right">
          <div id="hud-btns">
            <button type="button" id="btn-lang" tabindex="-1">EN</button>
            <button type="button" id="btn-journal" tabindex="-1">經文</button>
            <button type="button" id="btn-mute" tabindex="-1">靜音</button>
          </div>
          <div id="progress" class="hidden"></div>
          <div id="faith" class="hidden">
            <div id="faith-track"><div id="faith-fill"></div></div>
            <span>信心</span>
          </div>
          <div id="wind" class="hidden">風向 ↓</div>
        </div>
      </div>
      <div id="hint">方向鍵或 WASD 移動 · 空白鍵或 E 交談</div>
      <div id="objective"></div>
    </div>
    <div id="dialogue" class="hidden">
      <div id="d-name"></div>
      <div id="d-text"></div>
      <div id="d-ref"></div>
      <div id="d-next">空白鍵繼續</div>
    </div>
    <div id="screen" class="hidden"></div>
  </div>

  <div id="touch">
    <div class="pad">
      <button type="button" class="up" data-dir="up" aria-label="上">↑</button>
      <button type="button" class="left" data-dir="left" aria-label="左">←</button>
      <button type="button" class="right" data-dir="right" aria-label="右">→</button>
      <button type="button" class="down" data-dir="down" aria-label="下">↓</button>
    </div>
    <button type="button" id="btn-talk" aria-label="空白">空白</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
